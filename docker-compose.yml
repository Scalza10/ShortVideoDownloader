services:
  api:
    build: .
    ports:
      - "127.0.0.1:8000:8000"   # reachable from the VM only; the proxy stack's Caddy fronts it
    env_file: .env
    environment:
      STORAGE_DIR: /data/files
      TEMP_DIR: /data/tmp
    volumes:
      - ./data:/data
      # Uncomment to enable Instagram (and NSFW/protected X) downloads, and set COOKIES_FILE=/cookies.txt in .env
      # - ./cookies.txt:/cookies.txt:ro
    networks:
      web:
        # The name Caddy (proxy/Caddyfile) uses. Not "api": other apps on the network may have one.
        aliases: [reels-api]
    restart: unless-stopped

networks:
  # Shared with Caddy and any other app on the VM. Create it once: docker network create web
  web:
    external: true
